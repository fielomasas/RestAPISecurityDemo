spring.application.name=spring_rest
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=system
spring.datasource.password=fiel1234

# Only show warnings and errors in the console
logging.level.root=warn

# Disable the Spring Boot startup banner
spring.main.banner-mode=off

# Add logging configs to display SQL statements
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# COnfigure Hibernate to automatically create the tables
spring.jpa.hibernate.ddl-auto=update